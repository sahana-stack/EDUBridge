<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeSTU — AI-Powered Student Academic & Well-Being Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Custom Master Stylesheets -->
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Unified Top App Navigation Header -->
  <header class="app-header">
    <div class="brand-container" id="brandHomeBtn">
      <div class="brand-logo">BS</div>
      <div>
        <h1 class="brand-title">BridgeSTU</h1>
        <div class="brand-tagline">AI-Powered Academic & Well-Being Platform</div>
      </div>
    </div>

    <!-- Role & Mode Switcher Pill -->
    <div class="role-switcher-container">
      <span class="role-switcher-label"><i class="fas fa-layer-group" style="margin-right: 4px;"></i> View:</span>
      <button class="role-btn active landing" data-role="landing">
        <i class="fas fa-home"></i> Home Landing
      </button>
      <button class="role-btn student" data-role="student">
        <i class="fas fa-user-graduate"></i> Student Portal
      </button>
      <button class="role-btn parent" data-role="parent">
        <i class="fas fa-users-between-lines"></i> Parent Portal
      </button>
      <button class="role-btn teacher" data-role="teacher">
        <i class="fas fa-chalkboard-teacher"></i> Teacher Portal
      </button>
    </div>

    <!-- Supabase Status, Login & User Profile Badge -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="badge badge-warning" id="supabaseStatusBadge" style="cursor: pointer; font-size: 11px; padding: 6px 12px; border-radius: 20px;" onclick="openSupabaseModal()" title="Click to configure Supabase Connection">
        <i class="fas fa-database"></i> Supabase: Config
      </span>

      <button class="btn btn-primary" id="headerLoginBtn" style="padding: 6px 14px; font-size: 13px; border-radius: 20px; font-weight: 600;" onclick="window.openLoginModal()">
        <i class="fas fa-sign-in-alt"></i> Log In / Switch Portal
      </button>

      <div class="user-profile-badge" id="profileBadge" style="cursor: pointer;" onclick="window.openLoginModal()" title="Click to Switch User / Log Out">
        <div class="user-avatar" id="userAvatar">AM</div>
        <div class="user-info">
          <span class="user-name" id="userName">Alex Morgan</span>
          <span class="user-role-tag" id="userRoleTag">STUDENT PORTAL</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Application Container -->
  <div class="app-container" id="appContainer">
    <!-- Sidebar Navigation (Active when in Portal Mode) -->
    <nav class="sidebar" id="sidebarNav" style="display: none;">
      <!-- Populated dynamically via app.js -->
    </nav>

    <!-- Dynamic Main Content View -->
    <main class="main-content" id="mainContent" style="padding: 0;">
      <!-- Views rendered dynamically via app.js -->
    </main>
  </div>

  <!-- Floating AI Assistant Trigger -->
  <button class="floating-ai-btn" id="toggleAiBtn" title="Ask BridgeSTU AI Assistant">
    <i class="fas fa-sparkles"></i>
  </button>

  <!-- AI Chat Assistant Drawer -->
  <div class="ai-drawer" id="aiDrawer">
    <div class="ai-drawer-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="brand-logo" style="width: 32px; height: 32px; font-size: 16px;">AI</div>
        <div>
          <h3 style="font-size: 14px; font-weight: 800; color: #0f172a;">BridgeSTU AI Helper</h3>
          <span style="font-size: 11px; color: #4338ca;">Explainable Decision-Support Engine</span>
        </div>
      </div>
      <button class="modal-close" id="closeAiDrawer">&times;</button>
    </div>

    <div class="ai-messages" id="aiMessages">
      <div class="chat-bubble bot">
        Hello! I am your <strong>BridgeSTU AI Assistant</strong>. Ask me for study strategies, schedule optimization, or subject improvement advice!
      </div>
    </div>

    <div class="ai-input-area">
      <input type="text" id="aiInput" class="form-control" placeholder="Ask AI e.g. How do I improve in Math?">
      <button class="btn btn-primary" id="sendAiMsgBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Reusable Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContainer">
      <!-- Modal Content Populated via JavaScript -->
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/app.js"></script>
  <script>
    function openSupabaseModal() {
      const container = document.getElementById('modalContainer');
      const overlay = document.getElementById('modalOverlay');
      if (!container || !overlay) return;

      const currentUrl = window.EDUBRIDGE_SUPABASE ? window.EDUBRIDGE_SUPABASE.url : '';
      const currentKey = window.EDUBRIDGE_SUPABASE ? window.EDUBRIDGE_SUPABASE.anonKey : '';

      container.innerHTML = `
        <div class="modal-header">
          <h3 class="modal-title"><i class="fas fa-database" style="color: #4f46e5;"></i> Supabase Database Settings</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">
            Connect your live Supabase PostgreSQL project to persist marks, health logs, assignments, direct messages, and parental consent across sessions.
          </p>
          <div class="form-group" style="margin-bottom: 12px;">
            <label class="form-label">Supabase Project URL</label>
            <input type="text" id="supabaseUrlInput" class="form-control" placeholder="https://your-project.supabase.co" value="${currentUrl}">
          </div>
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label">Supabase Anon Key</label>
            <input type="password" id="supabaseKeyInput" class="form-control" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." value="${currentKey}">
          </div>
          <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 12px; color: #475569;">
            <i class="fas fa-info-circle" style="color: #6366f1;"></i> SQL DDL Schema available in <code>schema.sql</code> file in project repository.
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="window.EDUBRIDGE_SUPABASE.clearCredentials()">Clear Config</button>
          <button class="btn btn-primary" onclick="saveSupabaseConfig()"><i class="fas fa-save"></i> Connect & Save</button>
        </div>
      `;
      overlay.classList.add('active');
    }

    function saveSupabaseConfig() {
      const url = document.getElementById('supabaseUrlInput')?.value;
      const key = document.getElementById('supabaseKeyInput')?.value;
      if (!url || !key) {
        alert('Please enter both Supabase URL and Anon Key.');
        return;
      }
      window.EDUBRIDGE_SUPABASE.saveCredentials(url, key);
    }

    function closeModal() {
      document.getElementById('modalOverlay')?.classList.remove('active');
    }
  </script>
</body>
</html>
